version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Watches the Juice Shop image in the workflow's service container.
  - package-ecosystem: docker
    directory: /.github/workflows
    schedule:
      interval: weekly
